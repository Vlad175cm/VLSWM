[preferred]
# ScreenCast/Screenshot portals are not used: vlswm records and captures
# directly through wlr-screencopy (wf-recorder, grim).
default = gtk
# Open file pickers in yazi. If the termfilechooser backend is not installed,
# fall back to the GTK dialog instead of breaking the picker.
org.freedesktop.impl.portal.FileChooser = termfilechooser;gtk
