# vlswm foot configuration
#
# The generated theme file is included first. It contains [colors-light]
# for the white theme (SUPER+T). The base [colors-dark] palette is below.
include=~/.config/foot/vlswm-theme.ini

[main]
font=JetBrainsMono Nerd Font:size=14
pad=8x6 center-when-maximized-and-fullscreen
shell=/usr/bin/fish
dpi-aware=no
initial-color-theme=dark
selection-target=clipboard

[scrollback]
lines=10000

[mouse]
hide-when-typing=yes

[cursor]
style=block
blink=no

[colors-dark]
alpha=1.0
background=000000
foreground=ffffff
flash=ffffff
cursor=ffffff 000000
selection-foreground=000000
selection-background=ffffff
regular0=000000
regular1=ffffff
regular2=ffffff
regular3=ffffff
regular4=ffffff
regular5=ffffff
regular6=ffffff
regular7=ffffff
bright0=666666
bright1=ffffff
bright2=ffffff
bright3=ffffff
bright4=ffffff
bright5=ffffff
bright6=ffffff
bright7=ffffff
